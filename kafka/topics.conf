# Settings for TLSOC topics, applied by kafka/setup-topics.sh to topics that EXIST.
#
# Nothing here is created in advance. A source's topic, tlsoc.logs.<source>,
# is created by Kafka on that source's first line, with KAFKA_DEFAULT_PARTITIONS
# partitions (.env, default 1). Within 5 minutes setup-topics.sh (cron, set up
# by install.sh) gives it the settings below. A source that never sends never
# gets a topic, so listing one here costs nothing.
#
# Columns: <source>  <partitions>  [retention_hours]
#   source      = the source name, or * for every TLSOC topic not listed
#   partitions  = how many engine workers can share this source. Only busy
#                 sources need more than 1. Kafka can raise it, never lower it.
#                 Never give more than 1 to a source whose rule joins several
#                 lines in order (strategy: stateful, e.g. postfix).
#   retention   = hours Kafka keeps messages as a buffer while the engine is
#                 down (default: the broker's 168 h). Elasticsearch retention is
#                 separate (docs/retention-and-storage.md).
#
# Example - keep every TLSOC topic 48 hours:
# *             1     48

squid           6
dns             6
nginx           3
apache          3
auth            3
sso             3
radius          3
suricata        3
modsec          3
