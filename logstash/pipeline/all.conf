# =================================================================
#  FOSS SOC - UNIVERSAL LOGSTASH ROUTER
# =================================================================
#  Usage:
#  1. Save this as /etc/logstash/conf.d/all.conf
#  2. Ensure Logstash has READ permission on the input_path
# =================================================================

input {
  file {
    # [VAR 1] Path to your Python Engine's output JSONs
    path => "/parser_output/*.json"
    
    # -------------------------------------------------------------
    # DO NOT CHANGE SETTINGS BELOW
    # -------------------------------------------------------------
    codec => json
    mode => "tail"
    start_position => "end"
#    sincedb_path => "/dev/null"   # In PROD, remove this line to persist state
  }
}

filter {
  # -------------------------------------------------------------
  # DYNAMIC ROUTING LOGIC
  # Extracts the filename (e.g., 'modsec.json') to use as the index name
  # -------------------------------------------------------------
  
  grok {
    match => { "[log][file][path]" => ".*/%{DATA:service_name}\.json$" }
    match => { "path" => ".*/%{DATA:service_name}\.json$" }
  }

  # Safety Net: If filename extraction fails, tag as 'generic'
  if ![service_name] {
    mutate { add_field => { "service_name" => "generic" } }
  }

  # Cleanup: Remove internal Logstash metadata to save disk space
  mutate {
    remove_field => [ "path", "host", "@version", "log" ]
  }
}

output {
  elasticsearch {
    # [VAR 2] Elasticsearch Connection
    hosts    => ["https://elasticsearch:9200"]
    user     => "elastic"
    password => "${ELASTIC_PASSWORD}"
    
    # [VAR 3] SSL/TLS Settings
    cacert   => "/usr/share/logstash/config/certs/ca.crt"
    ssl_certificate_verification => false
    
    # [VAR 4] Index Naming Convention (weekly indices)
    # Result: fosstlsoc-logs-postfix-2026.05  (ISO week-year.week)
    index    => "fosstlsoc-logs-%{service_name}-%{+xxxx.ww}"
    
    # Optimization
    ilm_enabled => true
  }
  
  # Debug: Uncomment to see logs in console
  # stdout { codec => rubydebug }
}
