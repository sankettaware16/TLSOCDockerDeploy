# =================================================================
#  TLSOC - UNIVERSAL LOGSTASH ROUTER
# =================================================================
#  Tails the ECS NDJSON files written by the TLSOC Engine and indexes
#  every event into a per-service daily index:
#
#      fosstlsoc-logs-<service>-YYYY.MM.dd      (e.g. fosstlsoc-logs-nginx-2026.11.02)
#
#  <service> is the output file name without ".json" (nginx.json -> nginx),
#  so a new log source needs NO change here: add the engine rule, map the
#  source, and its index appears automatically.
#
#  The engine output folder is mounted at /parser_output (ENGINE_OUTPUT_DIR
#  in .env). The Elasticsearch password comes from the container
#  environment (ELASTIC_PASSWORD), never from this file.
# =================================================================

input {
  file {
    # The engine renames <service>.json -> <service>.json.1 (inode kept) when
    # it reaches output.rotate_mb, so watch both: the tail of a rotated file
    # is then read to completion instead of being cut off.
    path => ["/parser_output/*.json", "/parser_output/*.json.1"]

    codec => json
    mode  => "tail"

    # A file created after rotation must be read from its first byte; files
    # already known to the sincedb (persisted in the logstashdata volume)
    # keep their saved offset, so a restart never re-reads or skips events.
    start_position => "beginning"

    # Read a bounded slice per file per turn instead of each file to EOF, so
    # one source with a backlog (for example after an outage) cannot starve
    # the others. 64 x 32 KB = 2 MB per file per turn, polled every 100 ms.
    file_chunk_count => 64
    stat_interval    => 0.1
  }
}

filter {
  # -------------------------------------------------------------
  # DYNAMIC ROUTING: file name -> service_name (index name part).
  # Also matches the rotated generation (nginx.json.1).
  # and per-worker files of a multi-worker engine (squid.w0.json, squid.w3.json.1).
  # -------------------------------------------------------------
  grok {
    match => { "[log][file][path]" => ".*/%{DATA:service_name}(\.w\d+)?\.json(\.\d+)?$" }
    match => { "path"              => ".*/%{DATA:service_name}(\.w\d+)?\.json(\.\d+)?$" }
  }

  # Safety net: if the file name cannot be parsed, keep the event anyway.
  if ![service_name] {
    mutate { add_field => { "service_name" => "generic" } }
  }

  # -------------------------------------------------------------
  # Remove ONLY Logstash's own metadata. The engine's own host.name (which
  # server produced the event) and log.level (for example nginx error
  # severity) are preserved; the file input's host.name is just the
  # container id (12 hex chars) and is dropped.
  # -------------------------------------------------------------
  if [log][level] { mutate { rename => { "[log][level]" => "[tmp_loglevel]" } } }
  if [host][name] and [host][name] !~ /^[0-9a-f]{12}$/ {
    mutate { rename => { "[host][name]" => "[tmp_hostname]" } }
  }

  mutate {
    remove_field => [ "path", "host", "@version", "log" ]
  }

  if [tmp_loglevel] { mutate { rename => { "[tmp_loglevel]" => "[log][level]" } } }
  if [tmp_hostname] { mutate { rename => { "[tmp_hostname]" => "[host][name]" } } }
}

output {
  elasticsearch {
    hosts    => ["https://elasticsearch:9200"]
    user     => "elastic"
    password => "${ELASTIC_PASSWORD}"

    # TLS: the server certificate is verified against the stack's local CA
    # (its SAN is DNS:elasticsearch, the name used above).
    cacert   => "/usr/share/logstash/config/certs/ca.crt"

    # One index per service per day. Index lifecycle (retention) is managed
    # with ILM policies/index templates in Kibana, not by the output plugin,
    # so the index name below is used exactly as written.
    index       => "fosstlsoc-logs-%{service_name}-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }

  # Debug: uncomment to print every event to `docker logs logstash`.
  # stdout { codec => rubydebug }
}
