# =================================================================
#  TLSOC - THREAT-INTELLIGENCE PIPELINE
# =================================================================
#  Indexes the IOC files written by the collectors in intel/
#  (AbuseIPDB, AlienVault OTX, OpenPhish, MISP) into one index:
#
#      tlsoc-threat-intel
#
#  Collectors write to <engine output>/threat_intel/*.json, which is
#  /parser_output/threat_intel/ inside this container. The main pipeline
#  (all.conf) only reads /parser_output/*.json, so these files are never
#  indexed twice.
# =================================================================

input {
  file {
    path  => "/parser_output/threat_intel/*.json"
    codec => json
    mode  => "tail"
    start_position => "beginning"
  }
}

filter {
  mutate {
    add_field => { "tlsoc_category" => "threat_intel" }
  }

  # Deterministic document id: the same IOC from the same feed always maps
  # to the same document, so a re-read (new sincedb, replayed file) updates
  # the existing document instead of creating a duplicate.
  fingerprint {
    source => ["intel_source", "ioc_type", "ioc_value"]
    concatenate_sources => true
    method => "SHA256"
    target => "[@metadata][ioc_id]"
  }

  mutate {
    remove_field => [ "path", "host", "@version", "log" ]
  }
}

output {
  elasticsearch {
    hosts    => ["https://elasticsearch:9200"]
    user     => "elastic"
    password => "${ELASTIC_PASSWORD}"
    cacert   => "/usr/share/logstash/config/certs/ca.crt"

    index       => "tlsoc-threat-intel"
    document_id => "%{[@metadata][ioc_id]}"
    ilm_enabled => false
  }
}
