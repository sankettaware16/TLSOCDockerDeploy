
# Cap container logs so a noisy service can never fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "200m"
    max-file: "3"

services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: elasticsearch
    restart: unless-stopped
    logging: *default-logging
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms${ELASTIC_HEAP} -Xmx${ELASTIC_HEAP}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}

      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=/usr/share/elasticsearch/config/certs/elasticsearch.key
      - xpack.security.http.ssl.certificate=/usr/share/elasticsearch/config/certs/elasticsearch.crt
      - xpack.security.http.ssl.certificate_authorities=/usr/share/elasticsearch/config/certs/ca.crt
    volumes:
      - ./certs/elasticsearch:/usr/share/elasticsearch/config/certs
      - ./certs/ca/ca.crt:/usr/share/elasticsearch/config/certs/ca.crt
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}
    container_name: kibana
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}

      - SERVER_SSL_ENABLED=true
      - SERVER_SSL_CERTIFICATE=/usr/share/kibana/config/certs/kibana.crt
      - SERVER_SSL_KEY=/usr/share/kibana/config/certs/kibana.key
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=/usr/share/kibana/config/certs/ca.crt
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:?KIBANA_ENCRYPTION_KEY is not set in .env - run ./install.sh}
    volumes:
      - ./certs/kibana:/usr/share/kibana/config/certs
      - ./certs/ca/ca.crt:/usr/share/kibana/config/certs/ca.crt
    ports:
      - "${KIBANA_PORT}:5601"
  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    restart: unless-stopped
    logging: *default-logging

    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:9092,EXTERNAL://${HOST_IP}:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093

      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1

      # Stamp messages with the broker's receive time, not the producer's, so
      # retention and lag reflect when data actually arrived.
      - KAFKA_LOG_MESSAGE_TIMESTAMP_TYPE=LogAppendTime

      # Keep topic data and KRaft metadata on the named volume below. The
      # image's default (/tmp/kraft-combined-logs) is not owned by the Kafka
      # user once a volume is mounted over it; /var/lib/kafka/data is.
      - KAFKA_LOG_DIRS=/var/lib/kafka/data

      # One topic per log source (tlsoc.logs.<source>). install.sh creates the
      # standard ones (kafka/topics.conf); a new source's topic is created on
      # first use with this many partitions, so onboarding needs no Kafka step.
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_NUM_PARTITIONS=${KAFKA_DEFAULT_PARTITIONS:-3}

    ports:
      - "9094:9094"   # EXTERNAL ONLY
    volumes:
      # Topic data + KRaft metadata survive container recreation.
      - kafkadata:/var/lib/kafka/data

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION}
    container_name: logstash
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - kafka
      - elasticsearch
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./certs/logstash:/usr/share/logstash/config/certs
      - ./certs/ca/ca.crt:/usr/share/logstash/config/certs/ca.crt

      # Folder where the TLSOC Engine writes its ECS NDJSON (engine config
      # `paths.output_dir`). The two must match; override in .env if needed.
      - ${ENGINE_OUTPUT_DIR:-/var/log/soc_output}:/parser_output:ro
      # Persist Logstash's read positions (sincedb) across container recreation.
      - logstashdata:/usr/share/logstash/data
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
      - ./logstash/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml

    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}

volumes:
  esdata:
  kafkadata:
  logstashdata:
