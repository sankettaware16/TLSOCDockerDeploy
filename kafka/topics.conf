# Standard TLSOC topics, created by kafka/setup-topics.sh (run by install.sh).
#
# Every log source has ONE name used end to end:
#   rsyslog tag  ->  Kafka topic tlsoc.logs.<source>  ->  engine rule (source: <source>)
#   ->  index fosstlsoc-logs-<source>-YYYY.MM.dd
#
# A source that is not listed here still works: its topic is created
# automatically on first use with KAFKA_DEFAULT_PARTITIONS partitions (.env).
# List it here only to give it more partitions or a different retention.
#
# Columns: <source>  <partitions>  [retention_hours]
#   partitions  = how many engine workers can share this source; give the
#                 busiest sources more. Raising later is fine (re-run the
#                 script); Kafka can never lower it.
#                 Keep 1 for sources whose rule joins several lines in order
#                 (postfix).
#   retention   = hours Kafka keeps messages as a buffer (default: broker
#                 setting, 168 h). Elasticsearch retention is separate
#                 (docs/retention-and-storage.md).

auth            3
nginx           3
apache          3
squid           6
dns             6
postfix         1
radius          3
sso             3
policyd_spf     1
suricata        3
modsec          3
fim             1
nessus          1
openvas         1
roundcube       1
okta            1
google_workspace 1
